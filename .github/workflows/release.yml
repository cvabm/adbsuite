# 推送到 main 后自动升版、构建 Windows 包并发布 GitHub Release
# 也可在 Actions 页手动触发（可选 major/minor/patch）
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Resolve next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
          BUMP="${{ github.event.inputs.bump || 'patch' }}"

          if [[ -z "${LATEST}" ]]; then
            VERSION="v0.1.0"
            echo "No existing tags, first release: ${VERSION}"
          else
            echo "Latest tag: ${LATEST}"
            VER="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VER}"
            MAJOR=${MAJOR:-0}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            case "${BUMP}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          # 防止 tag 已存在（并发或重跑）
          while git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null 2>&1; do
            echo "Tag ${VERSION} already exists, bumping patch"
            VER="${VERSION#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VER}"
            PATCH=$((PATCH + 1))
            VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          done

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${VERSION} (bump=${BUMP})"

      - name: Build (Wails)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          wails build -clean -platform windows/amd64 \
            -ldflags "-X main.version=${VERSION}"

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="dist/adbsuite-${VERSION}-windows-amd64"
          mkdir -p "${STAGE}"

          if [[ -f build/bin/adbsuite.exe ]]; then
            cp build/bin/adbsuite.exe "${STAGE}/"
          elif [[ -f "build/bin/ADB Suite.exe" ]]; then
            cp "build/bin/ADB Suite.exe" "${STAGE}/adbsuite.exe"
          else
            echo "Built executable not found under build/bin:"
            ls -la build/bin || true
            exit 1
          fi

          # 内置 adb / scrcpy（与 README 分发方式一致）
          if [[ -d bin ]]; then
            cp -r bin "${STAGE}/bin"
          else
            echo "Warning: bin/ directory missing; release will only contain the exe"
          fi

          mkdir -p release
          (
            cd dist
            7z a -tzip "../release/adbsuite-${VERSION}-windows-amd64.zip" \
              "adbsuite-${VERSION}-windows-amd64/*"
          )
          ls -la release/

      - name: Create tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ADB Suite ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            release/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
